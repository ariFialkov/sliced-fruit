name: Deploy to GitHub Pages

# Publishes the repo root (the game is a static site) to the gh-pages branch.
# GitHub serves that branch at https://arifialkov.github.io/sliced-fruit/

on:
  push:
    branches: [claude/sliced-fruit-pwa-game-34rgp7]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github
          touch .nojekyll
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Deploy ${GITHUB_SHA} to GitHub Pages"
          git push -f origin gh-pages
